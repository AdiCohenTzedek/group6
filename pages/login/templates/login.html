{% extends "base.html" %}

{% block title %}כניסה למערכת{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('login.static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
    <div class="login-container">
        <h1>כניסה למערכת</h1>
        <form action="#" method="post" class="login-form">
            <label for="email">email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">password</label>
            <input type="password" id="password" name="password" required>

            <div class="actions">
                <button type="submit" class="submit-button">enter</button>
            </div>
        </form>
        <p class="signup">
            not a user yet? sign in <a href="{{ url_for('sign_up.sign_up_func') }}">here</a>
        </p>
    </div>

    <script src="{{ url_for('login.static', filename='js/login.js') }}"></script>
{% endblock %}
