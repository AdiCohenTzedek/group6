{% extends "base.html" %}

{% block title %}בחירת אימון{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('choose_workout.static', filename='css/choose_workout.css') }}">
{% endblock %}

{% block content %}
    <header>
        <h1>קביעת אימון</h1>
    </header>

    <main>
        <div class="weekdays">
            <div class="day">ש</div>
            <div class="day">ו</div>
            <div class="day">ה</div>
            <div class="day">ד</div>
            <div class="day highlighted">ג</div>
            <div class="day">ב</div>
            <div class="day">א</div>
        </div>

        <div class="workout-list">
            <div class="workout-item">
                <div class="button-group">
                    <button class="add-button">+</button>
                </div>
                <div class="workout-info">
                    <p>פילאטיס מכשירים</p>
                    <p class="trainer">יובל כהן</p>
                </div>
                <span class="time">8:30</span>
            </div>
            <div class="workout-item">
                <div class="button-group">
                    <button class="add-button">+</button>
                </div>
                <div class="workout-info">
                    <p>פילאטיס מזרן</p>
                    <p class="trainer">יובל כהן</p>
                </div>
                <span class="time">9:30</span>
            </div>
            <div class="workout-item">
                <div class="button-group">
                    <button class="add-button">+</button>
                </div>
                <div class="workout-info">
                    <p>Barre</p>
                    <p class="trainer">נועם לוי</p>
                </div>
                <span class="time">18:00</span>
            </div>
            <div class="workout-item">
                <div class="button-group">
                    <button class="add-button">+</button>
                </div>
                <div class="workout-info">
                    <p>פונקציונלי</p>
                    <p class="trainer">נועם לוי</p>
                </div>
                <span class="time">19:00</span>
            </div>
        </div>
    </main>
    <script src="{{ url_for('choose_workout.static', filename='js/choose_workout.js') }}"></script>
{% endblock %}
